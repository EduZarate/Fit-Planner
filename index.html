<style>
/* Layout: una columna tipo libreta de gimnasio; tarjetas por aparato agrupadas por zona, ficha a pantalla completa al tocar */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #141a26;
  --muted: #5d6677;
  --line: #d8dde6;
  --accent: #2346d8;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8fd;
  --good: #1d7a4a;
  --good-soft: #def3e7;
  --warn: #a25a00;
  --warn-soft: #fbecd6;
  --danger: #b4232f;
  --mach: #9aa6c4;
  --move: #d9822b;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #181e2a; --ink: #e9edf5; --muted: #98a2b5; --line: #2a3242;
    --accent: #7d97ff; --accent-ink: #0d1430; --accent-soft: #1f2a4d;
    --good: #5fd39a; --good-soft: #163527; --warn: #f1b35c; --warn-soft: #3a2a14; --danger: #ff7a84; --mach: #56627d; --move: #f1a24c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #181e2a; --ink: #e9edf5; --muted: #98a2b5; --line: #2a3242;
  --accent: #7d97ff; --accent-ink: #0d1430; --accent-soft: #1f2a4d;
  --good: #5fd39a; --good-soft: #163527; --warn: #f1b35c; --warn-soft: #3a2a14; --danger: #ff7a84; --mach: #56627d; --move: #f1a24c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.titlerow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.cloud { background: var(--good); }
.dot.err { background: var(--danger); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; height: 42px; min-width: 42px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 14px; }
.search { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.zone { margin-top: 18px; }
.zone h2 { font-family: var(--font-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.list { display: grid; gap: 8px; }
.card { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 14px 10px 10px; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 4px 12px; }
.thumb { grid-row: 1 / span 2; width: 56px; height: 56px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 88%; height: 88%; }
.ico .ps { stroke: var(--accent); stroke-width: 5.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ico .pf { fill: var(--accent); }
.ico .ms { stroke: var(--mach); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ico .mf { fill: var(--mach); }
.ico .ar { stroke: var(--move); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tips { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.vidbtn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; height: 48px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; }
.hero { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero svg { width: 150px; height: 150px; }
.hero.icon { aspect-ratio: auto; height: 170px; }
.photoacts { display: flex; gap: 8px; flex-wrap: wrap; }
.photoacts .btn { flex: 1 1 140px; height: 44px; }
.filebtn { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.card:active { transform: scale(.99); }
.card .name { font-weight: 600; font-size: 16px; min-width: 0; }
.card .meta { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
.card .w { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.card .w small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.card .w.empty { font-size: 15px; font-weight: 500; color: var(--muted); font-family: var(--font-body); }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.up { background: var(--accent-soft); color: var(--accent); }
.empty-note { color: var(--muted); text-align: center; padding: 30px 0; }
.foot { margin-top: 22px; font-size: 13px; color: var(--muted); }

.fab { position: fixed; z-index: 6; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; height: 52px; padding: 0 20px; font-weight: 600; font-size: 15px; box-shadow: 0 6px 20px rgb(0 0 0 / .18); }

/* Ficha */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .wrap { padding-block: 10px 40px; display: grid; gap: 16px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kicker { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: 14px; color: var(--muted); font-weight: 600; }
.sheet h3 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 2px 0 0; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.panel h4 { margin: 0; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--muted); font-weight: 600; }
.weightrow { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.step { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 26px; font-weight: 600; }
.wbox { display: flex; align-items: baseline; justify-content: center; gap: 4px; min-width: 0; }
.wbox input { width: 100%; max-width: 190px; text-align: center; border: 0; background: transparent; font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.wbox input::-webkit-outer-spin-button, .wbox input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wbox input::placeholder { color: var(--line); }
.wbox span { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--muted); }
.goal { text-align: center; font-size: 14px; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; padding: 0 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.suggest { border-radius: var(--r); background: var(--good-soft); color: var(--ink); padding: 14px; display: grid; gap: 10px; }
.suggest p { margin: 0; }
.suggest strong { color: var(--good); }
.suggest .actions .btn.primary { background: var(--good); border-color: var(--good); color: var(--surface); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 11px; }
.hist { display: grid; gap: 0; }
.hrow { display: grid; grid-template-columns: 1fr auto auto 34px; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hrow:first-child { border-top: 0; }
.hrow .hw { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.xbtn { border: 0; background: transparent; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; font-size: 18px; }
label.f { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
.in { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; width: 100%; }
textarea.in { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.startbtn { width: 100%; height: 54px; border: 0; border-radius: var(--r); background: var(--ink); color: var(--bg); font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
.musc { display: flex; flex-wrap: wrap; gap: 4px; }
.musc span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.rlist { display: grid; gap: 8px; counter-reset: ex; }
.ritem { display: grid; grid-template-columns: 26px 48px 1fr auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
.ritem.done { opacity: .6; }
.ritem .num { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.ritem.done .num { color: var(--good); }
.ritem .thumb { width: 48px; height: 48px; grid-row: auto; }
.ritem .open { all: unset; cursor: pointer; display: grid; gap: 3px; min-width: 0; }
.ritem .open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ritem .rn { font-weight: 600; }
.ritem .rw { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.ritem .swap { grid-column: 4; justify-self: end; border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 0; }
.sizer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sizer .step { width: 44px; height: 44px; font-size: 22px; }
.sizer b { font-family: var(--font-display); font-size: 26px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.nextbtn { width: 100%; }
.hdbtns { display: flex; gap: 6px; }
.motiv { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; margin-top: 10px; }
.lvl { grid-row: 1 / span 2; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--accent-ink); background: var(--accent); }
.motiv .mt { grid-column: 2; grid-row: 1; font-weight: 600; min-width: 0; }
.motiv .ms { grid-column: 2; grid-row: 2; font-size: 13px; color: var(--muted); min-width: 0; }
.motiv .streak { grid-row: 1 / span 2; grid-column: 3; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; }
.motiv .streak small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.xpbar { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.lvlhero { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.lvlhero .lvl { width: 64px; height: 64px; font-size: 30px; }
.lvlhero .ln { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .tv { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .tl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.tile .tn { font-size: 13px; color: var(--muted); }
.heat { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.heat .col { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--line); max-width: 100%; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 40%, var(--surface)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.heat i.l3 { background: var(--accent); }
.heat i.fut { background: transparent; }
.heat i.tod { outline: 2px solid var(--ink); outline-offset: -1px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 76px 1fr 28px; gap: 8px; align-items: center; font-size: 14px; }
.bar .tr { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar .tr i { display: block; height: 100%; background: var(--accent); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.bar.low span { color: var(--warn); font-weight: 600; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ach { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; background: var(--surface); }
.ach .ae { font-size: 26px; line-height: 1; }
.ach .at { font-weight: 600; font-size: 14px; line-height: 1.2; }
.ach .ad { font-size: 12px; color: var(--muted); }
.ach.off .ae { filter: grayscale(1); opacity: .45; }
.ach.off .at { color: var(--muted); }
.ach .xpbar { height: 5px; }
.ach.on { border-color: var(--accent); background: var(--accent-soft); }
.imps { display: grid; gap: 0; }
.imp { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.imp:first-child { border-top: 0; }
.imp b { color: var(--good); font-variant-numeric: tabular-nums; }
.celebrate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgb(0 0 0 / .45); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.celebrate .cbox { background: var(--surface); color: var(--ink); border-radius: 20px; padding: 26px 22px 20px; max-width: 360px; width: 100%; text-align: center; display: grid; gap: 8px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); animation: pop .45s cubic-bezier(.2, 1.4, .4, 1); }
.celebrate .ce { font-size: 64px; line-height: 1; }
.celebrate .ck { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--accent); font-weight: 700; }
.celebrate .ct { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; text-wrap: balance; }
.celebrate p { margin: 0; color: var(--muted); }
.celebrate .btn { margin-top: 8px; }
#confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap" id="home">

    <div class="titlerow">
      <div>
        <h1>Mis pesos</h1>

/* Rutina: primero lo que menos has hecho, sin repetir músculo con el ejercicio anterior, repartiendo zonas */
function buildRoutine(n, jitter, keep) {
  const pool = state.machines.slice();
  const out = (keep || []).slice(), zoneCount = {}, typeCount = {};
  out.forEach((m) => { zoneCount[m.zone] = (zoneCount[m.zone] || 0) + 1; typeCount[typeOf(m)] = (typeCount[typeOf(m)] || 0) + 1; });
  const base = (m) => m.hist.length * 3 + (m.hist.length ? 0 : -1) + (jitter ? Math.random() * jitter : 0);
  while (out.length < n) {
    const prev = out[out.length - 1];
    let best = null, bestS = Infinity;
    for (const m of pool) {
      if (out.includes(m) || clash(prev, m)) continue;
      const sc = base(m) + (zoneCount[m.zone] || 0) * 4 + (typeCount[typeOf(m)] || 0) * 8;
      if (sc < bestS) { bestS = sc; best = m; }
    }
    if (!best) break;
    out.push(best); zoneCount[best.zone] = (zoneCount[best.zone] || 0) + 1; typeCount[typeOf(best)] = (typeCount[typeOf(best)] || 0) + 1;
  }
  return out.map((m) => m.id);
}
function newRoutine(jitter) {
  const keep = (routineMachines() || []).filter(doneToday);
  state.routine = { d: today(), ids: buildRoutine(Math.max(state.settings.routineSize || 7, keep.length), jitter, keep) };
  save();
}
function swapIn(i) {
  const r = state.routine; const ms = r.ids.map((id) => state.machines.find((x) => x.id === id));
  const prev = ms[i - 1], next = ms[i + 1], cur = ms[i];
  const cands = state.machines.filter((m) => !r.ids.includes(m.id) && !clash(prev, m) && !clash(next, m) && !doneToday(m));
  if (!cands.length) { toast("No hay otro aparato compatible en esa posición"); return; }
  cands.sort((a, b) => (a.hist.length - b.hist.length) + (a.zone === cur.zone ? -0.5 : 0) - (b.zone === cur.zone ? -0.5 : 0) + (Math.random() - 0.5) * 2);
  r.ids[i] = cands[0].id; save();
}
const doneToday = (m) => !!(m && state.routine && m.hist.some((h) => h.d === state.routine.d));

  const r = state.routine; if (!r || r.d !== today()) return null;
  return r.ids.map((id) => state.machines.find((x) => x.id === id)).filter(Boolean);
}
/* ---------- Métricas, niveles y logros ---------- */
const DAY = 86400000;
const iso = (dt) => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
function weekStart(d) { const dt = parseD(d); const wd = (dt.getDay() + 6) % 7; return iso(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - wd)); }
const LEVELS = ["Novato", "Aprendiz", "Constante", "Dedicado", "Fuerte", "Atleta", "Máquina", "Bestia", "Titán", "Leyenda"];
const lvlXp = (L) => 50 * (L - 1) * L; // XP total para alcanzar el nivel L
function levelOf(xp) { let L = 1; while (xp >= lvlXp(L + 1)) L++; return L; }
const levelName = (L) => LEVELS[Math.min(L, LEVELS.length) - 1] + (L > LEVELS.length ? " " + (L - LEVELS.length + 1) : "");
function metrics() {
  const S = state.settings, ev = [], days = {}, dayZones = {};
  let completed = 0, volume = 0, raises = 0, prs = 0, club100 = false, doubled = false;
  const improv = [];
  state.machines.forEach((m) => {
    const h = m.hist; let max = -1;
    h.forEach((x, i) => {
      ev.push(x); days[x.d] = (days[x.d] || 0) + 1;
      (dayZones[x.d] = dayZones[x.d] || new Set()).add(m.zone);
      if (x.done) completed++;
      volume += x.w * S.reps * (x.done ? S.sets : Math.max(1, S.sets - 1));
      if (i > 0 && x.w > h[i - 1].w) raises++;
      if (i > 0 && x.w > max) prs++;
      max = Math.max(max, x.w);
      if (x.w >= 100) club100 = true;
    });
    if (h.length) {
      const first = h[0].w, cur = Math.max(m.w ?? 0, max);
      if (first > 0 && cur >= first * 2) doubled = true;
      if (first > 0 && cur > first) improv.push({ m, first, cur, pct: (cur - first) / first });
    }
  });
  const dayList = Object.keys(days).sort();
  const weeks = new Set(dayList.map(weekStart));
  const thisWeek = weekStart(today());
  let streak = 0; let w = parseD(thisWeek);
  if (!weeks.has(thisWeek)) w = new Date(w.getTime() - 7 * DAY);
  while (weeks.has(iso(w))) { streak++; w = new Date(w.getFullYear(), w.getMonth(), w.getDate() - 7); }
  const weekDays = dayList.filter((d) => weekStart(d) === thisWeek).length;
  const perWeek = {}; dayList.forEach((d) => { const k = weekStart(d); perWeek[k] = (perWeek[k] || 0) + 1; });
  const goalWeeks = Object.values(perWeek).filter((n) => n >= (S.weekGoal || 3)).length;
  const fullBody = Object.values(dayZones).some((z) => z.size >= 4);
  const tried = state.machines.filter((m) => m.hist.length).length;
  const zones30 = {}; const lim = iso(new Date(Date.now() - 30 * DAY));
  ZONES.forEach((z) => { if (state.machines.some((m) => m.zone === z)) zones30[z] = 0; });
  state.machines.forEach((m) => m.hist.forEach((x) => { if (x.d >= lim) zones30[m.zone] = (zones30[m.zone] || 0) + 1; }));
  const sessions = ev.length;
  const xp = sessions * 10 + completed * 5 + raises * 20 + tried * 15 + dayList.length * 20 + (state.flags?.routines || 0) * 30;
  const L = levelOf(xp);
  improv.sort((a, b) => b.pct - a.pct);

    if (!m.hist.some((x) => x.d === h.d && x.w === h.w)) m.hist.push({ d: h.d, w: round(h.w), done: !!h.done });
  });
  m.hist.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
}
async function applyImports(db) {
  try {
    const snap = await db.collection("imports").get();
    state.imports = Array.isArray(state.imports) ? state.imports : [];
    let n = 0;
    snap.docs.forEach((doc) => {
      if (state.imports.includes(doc.id)) return;
      let items; try { items = JSON.parse((doc.data() || {}).json || "[]"); } catch (e) { return; }
      if (Array.isArray(items)) items.forEach(applyItem);
      state.imports.push(doc.id); n++;
    });
    if (n) { save(); renderList(); if (openId) renderSheet(); toast("Se cargaron tus registros"); }
  } catch (e) {}
}
/* ---------- Cuenta en la nube (Supabase), solo en la versión web propia ---------- */
let sb = null, sbUser = null, sbRemoteAt = 0;
async function sbFetch() {
  const { data, error } = await sb.from("fp_state").select("data, updated_at").eq("user_id", sbUser.id).maybeSingle();
  if (error) throw error;
  return data;
}
async function sbReconcile() {
  const row = await sbFetch();
  const remoteAt = row ? Number(row.updated_at) || 0 : 0;
  if (row && row.data && remoteAt > (state.updatedAt || 0)) {
    state = migrate(row.data); lsWrite(); renderList(); if (!$("#sheet").hidden && sheetMode !== "edit") renderSheet();
  } else if ((state.updatedAt || 0) > remoteAt) await sbPush();
  sbRemoteAt = Math.max(remoteAt, sbRemoteAt);
  setStatus("cloud");
}
async function sbPush() {
  try {
    const { error } = await sb.from("fp_state").upsert({ user_id: sbUser.id, data: state, updated_at: state.updatedAt || Date.now() });
    if (error) throw error;
    // sube fotos que aún no estén en la nube
    for (const m of state.machines) if (m.photo && m.photo.local && !m.photo.synced) {
      const b = await idb.get(m.photo.local).catch(() => null);
      if (b) { const r = await sb.storage.from("fp-fotos").upload(sbUser.id + "/" + m.photo.local + ".jpg", b, { upsert: true, contentType: "image/jpeg" }); if (!r.error) { m.photo.synced = true; } }
    }
    setStatus("cloud");
  } catch (e) { setStatus("err"); }
}
async function sbConnect() {

    sb = window.supabase.createClient(window.FP_SB_URL, window.FP_SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

async function connect() {
  if (window.FP_SB_URL) return sbConnect();
  setStatus("loading");
  const timer = setTimeout(() => { if (!dbRef) setStatus("local"); }, 10000);
  try {
    if (!window.claude || !window.claude.use) throw 0;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) throw 0;
    const id = await user.id();
    if (!id) throw 0;
    const ref = db.doc("data/users/" + id + "/state");
    const snap = await ref.get();
    clearTimeout(timer);
    dbRef = ref;
    const d = snap.exists ? snap.data() : null;
    const remoteAt = (d && d.updatedAt) || 0;
    if (d && d.json && remoteAt > (state.updatedAt || 0)) {
      state = migrate(JSON.parse(d.json)); lsWrite(); renderList(); if (openId) renderSheet();
      setStatus("cloud");
    } else if ((state.updatedAt || 0) > remoteAt) { await pushDb(); }
    else setStatus("cloud");
    await applyImports(db);
  } catch (e) { clearTimeout(timer); setStatus("local"); }
  bootTail();
}
function bootTail() {
  if (window.FP_IMPORTS) {
    state.imports = Array.isArray(state.imports) ? state.imports : [];
    Object.entries(window.FP_IMPORTS).forEach(([k, items]) => { if (!state.imports.includes(k)) { items.forEach(applyItem); state.imports.push(k); state.updatedAt = Date.now(); lsWrite(); renderList(); } });
  }
  loadLocalPhotos();
  ready = true;
  if (checkAchievements()) { lsWrite(); if (dbRef || sbUser) pushDb(); }
  renderMotiv();
}

function chartSVG(hist) {
  if (hist.length < 2) return `<p class="hint">La gráfica aparece cuando registres al menos dos sesiones.</p>`;
  const W = 340, H = 170, L = 38, R = 12, T = 12, B = 26;
  const ws = hist.map((h) => h.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi - lo < 5) { const mid = (hi + lo) / 2; lo = mid - 2.5; hi = mid + 2.5; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const x = (i) => L + (i * (W - L - R)) / (hist.length - 1);
  const y = (w) => T + (1 - (w - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo, (lo + hi) / 2, hi].map((v) => Math.round(v * 2) / 2);
  const pts = hist.map((h, i) => `${x(i).toFixed(1)},${y(h.w).toFixed(1)}`);
  const area = `M${x(0)},${H - B} L${pts.join(" L")} L${x(hist.length - 1)},${H - B} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${hist.map((h, i) => `<circle cx="${x(i)}" cy="${y(h.w)}" r="${i === hist.length - 1 ? 5 : 3.5}" fill="${h.done ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${L}" y="${H - 6}">${esc(dfmt.format(parseD(hist[0].d)))}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(dfmt.format(parseD(hist[hist.length - 1].d)))}</text>
  </svg><p class="hint">Punto relleno: completaste el objetivo. Punto vacío: no llegaste.</p>`;
}

  openId = id; sheetMode = mode || "view"; confirmDel = false;
  if (!suggestion || suggestion.id !== id) suggestion = null;
  renderSheet(); $("#sheet").hidden = false; $("#sheet").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; openId = null; suggestion = null; renderList(); }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- Eventos ---------- */
$("#chips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; zoneFilter = b.dataset.z; renderList(); });
$("#q").addEventListener("input", (e) => { query = e.target.value; renderList(); });
$("#list").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openSheet(c.dataset.id); });
$("#btnAdd").addEventListener("click", () => openSheet(null, "new"));
$("#btnStart").addEventListener("click", () => openSheet(null, "routine"));
$("#btnStats").addEventListener("click", () => openSheet(null, "stats"));
$("#motiv").addEventListener("click", () => openSheet(null, "stats"));
$("#celebrate").addEventListener("click", (e) => { if (e.target.closest("[data-cnext]") || e.target.id === "celebrate") nextCelebration(); });
$("#btnSettings").addEventListener("click", () => openSheet(null, "settings"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) back(); });
function back() {
  if (sheetMode === "edit") { sheetMode = "view"; confirmDel = false; renderSheet(); }
  else if (sheetMode === "view" && fromRoutine) { fromRoutine = false; openId = null; suggestion = null; sheetMode = "routine"; renderSheet(); $("#sheet").scrollTop = 0; }
  else closeSheet();
}
const sh = $("#sheet");
sh.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const m = state.machines.find((x) => x.id === openId);
  if (act === "back") return back();
  if (act === "edit") { sheetMode = "edit"; return renderSheet(); }
  if (act === "delete" && m) {
    if (!confirmDel) { confirmDel = true; return renderSheet(); }
    state.machines = state.machines.filter((x) => x.id !== m.id); save(); toast("Aparato borrado"); return closeSheet();
  }
  if (act === "export") { exportBackup(); return; }
  if (act === "login") { closeSheet(); showLogin(); return; }
  if (act === "logout") { sb.auth.signOut().finally(() => { sbUser = null; try { localStorage.removeItem(LS_KEY); localStorage.removeItem("fp-sin-cuenta"); } catch (e) {} location.reload(); }); return; }
  if (act === "reroll") { newRoutine(6); return renderSheet(); }
  if (act === "rmore" || act === "rless") { state.settings.routineSize = Math.min(15, Math.max(3, (state.settings.routineSize || 7) + (act === "rmore" ? 1 : -1))); newRoutine(0); return renderSheet(); }
  if (act === "rswap") { swapIn(Number(b.dataset.i)); return renderSheet(); }
  if (act === "ropen" || act === "rnext") { openSheet(b.dataset.id, "view", true); return; }
  if (!m) return;
  const inc = incOf(m);
  if (act === "plus" || act === "minus") {
    const cur = m.w ?? 0;
    m.w = Math.max(0, round(cur + (act === "plus" ? inc : -inc)));
    save(); $("#wIn").value = fmt(m.w); return;
  }
  if (act === "done" || act === "fail") {
    if (m.w == null) { toast("Primero indica el peso que usas"); $("#wIn").focus(); return; }
    const prevMax = m.hist.length ? Math.max(...m.hist.map((h) => h.w)) : null;
    m.hist.push({ d: today(), w: m.w, done: act === "done" });
    if (prevMax != null && m.w > prevMax) queueCelebration({ e: "🏆", k: "Récord personal", t: m.name, p: "Nunca habías movido tanto aquí: " + fmt(m.w) + " kg (antes " + fmt(prevMax) + " kg)." });
    { const rm = routineMachines(); state.flags = state.flags || {};
      if (rm && rm.length && rm.every(doneToday) && state.flags.routineDay !== today()) { state.flags.routineDay = today(); state.flags.routines = (state.flags.routines || 0) + 1; } }
    if (act === "done") suggestion = { id: m.id, from: m.w, to: round(m.w + inc) };
    else toast("Apuntado. La próxima vez, mismo peso: " + fmt(m.w) + " kg");
    save(); return renderSheet();
  }
  if (act === "accept") { const pd = pendingFor(m); if (!pd) return; m.w = pd.to; suggestion = null; save(); toast("Nuevo peso: " + fmt(m.w) + " kg"); return renderSheet(); }
  if (act === "keep") { const last = m.hist[m.hist.length - 1]; if (last) last.kept = true; suggestion = null; save(); renderSheet(); return toast("Mantienes " + fmt(m.w) + " kg"); }
  if (act === "rmphoto") {
    const old = m.photo; m.photo = null; save(); renderSheet(); toast("Foto quitada");
    if (old && old.id) window.claude?.use?.("assets").then((a) => a && a.delete(old.id)).catch(() => {});
    if (old && old.local) { idb.del(old.local).catch(() => {}); if (sbUser) sb.storage.from("fp-fotos").remove([sbUser.id + "/" + old.local + ".jpg"]).catch(() => {}); }
    return;
  }
  if (act === "delh") { m.hist.splice(Number(b.dataset.i), 1); save(); return renderSheet(); }
});
async function shrink(file, max) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.8));
  } finally { URL.revokeObjectURL(url); }
}
const blobToData = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportBackup() {
  const photos = {};
  for (const m of state.machines) if (m.photo && m.photo.local) { try { const b = await idb.get(m.photo.local); if (b) photos[m.photo.local] = await blobToData(b); } catch (e) {} }
  const blob = new Blob([JSON.stringify({ app: "pesos-por-aparato", v: 1, exportedAt: new Date().toISOString(), state, photos })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "pesos-copia-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Copia exportada");
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== "pesos-por-aparato" || !data.state) throw new Error("formato");
    for (const [k, url] of Object.entries(data.photos || {})) { const b = await (await fetch(url)).blob(); await idb.put(k, b); localPhotos[k] = URL.createObjectURL(b); }
    state = migrate(data.state); save(); closeSheet(); toast("Copia importada");
  } catch (e) { toast("Ese archivo no es una copia válida de la app"); }
}
async function uploadPhoto(m, file) {
  const assets = window.claude?.use ? await window.claude.use("assets") : null;
  photoBusy = true; renderSheet();
  try {
    const blob = await shrink(file, assets ? 900 : 700);
    if (!blob) throw new Error("img");
    const old = m.photo;
    if (assets) {
      const r = await assets.upload(blob, { type: "image/jpeg" });
      m.photo = { id: r.id, url: r.url };
    } else {
      const k = "f_" + uid();
      await idb.put(k, blob);
      localPhotos[k] = URL.createObjectURL(blob);
      m.photo = { local: k };
      if (sbUser) sb.storage.from("fp-fotos").upload(sbUser.id + "/" + k + ".jpg", blob, { upsert: true, contentType: "image/jpeg" }).catch(() => {});
    }
    save(); toast("Foto guardada");
    if (old && old.id && assets) assets.delete(old.id).catch(() => {});
    if (old && old.local) { idb.del(old.local).catch(() => {}); if (sbUser) sb.storage.from("fp-fotos").remove([sbUser.id + "/" + old.local + ".jpg"]).catch(() => {}); }
  } catch (err) {
    toast(err && err.code === "too_large" ? "La foto es demasiado grande" : "No se pudo guardar la foto. Prueba con otra imagen.");
  } finally { photoBusy = false; if (openId === m.id) renderSheet(); }
}
sh.addEventListener("change", (e) => {
  if (e.target.id === "importIn") { const f = e.target.files && e.target.files[0]; if (f) importBackup(f); return; }
  if (e.target.id === "photoIn") {
    const m = state.machines.find((x) => x.id === openId); const f = e.target.files && e.target.files[0];
    if (m && f) uploadPhoto(m, f);
    return;
  }
  if (e.target.id === "wIn") {
    const m = state.machines.find((x) => x.id === openId); if (!m) return;
    const v = num(e.target.value);
    m.w = isFinite(v) && v >= 0 ? round(v) : null; save();
    e.target.value = m.w != null ? fmt(m.w) : "";
  }
});
let notesT;
sh.addEventListener("input", (e) => {
  if (e.target.id === "notes") {
    const m = state.machines.find((x) => x.id === openId); if (!m) return;
    m.notes = e.target.value; clearTimeout(notesT); notesT = setTimeout(save, 500);
  }
});
sh.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "editForm") {
    const name = $("#fName").value.trim(); if (!name) return;
    const zone = $("#fZone").value;
    const incV = num($("#fInc").value);
    const inc = isFinite(incV) && incV > 0 ? round(incV) : null;
    let video = $("#fVideo").value.trim();
    if (video && !/^https?:\/\//i.test(video)) video = "https://" + video;
    video = video.replace(/^http:/i, "https:").slice(0, 500);
    if (sheetMode === "new") {
      const m = { id: uid(), zone, name, w: null, inc, video, notes: "", hist: [] };
      state.machines.push(m); save(); openId = m.id; sheetMode = "view"; toast("Aparato creado");
    } else {
      const m = state.machines.find((x) => x.id === openId);
      Object.assign(m, { name, zone, inc, video }); save(); sheetMode = "view"; toast("Cambios guardados");
    }
    renderSheet();
  } else if (e.target.id === "setForm") {
    const s = state.settings;
    const clampInt = (v, lo, hi, d) => { const n = parseInt(v, 10); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
    s.rule = $("#sRule").value;
    s.sets = clampInt($("#sSets").value, 1, 10, 4);
    s.reps = clampInt($("#sReps").value, 1, 50, 10);
    s.weekGoal = clampInt($("#sGoal").value, 1, 7, 3);
    const inc = num($("#sInc").value); s.inc = isFinite(inc) && inc > 0 ? round(inc) : 2.5;
    save(); toast("Ajustes guardados"); closeSheet();
  }
});

renderList();
setStatus("local");
connect();
})();
</script>
